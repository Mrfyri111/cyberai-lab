# Собирает CyberAI_Lab.exe для Windows при каждом изменении кода
# и выкладывает его в релиз «windows-latest» — постоянная ссылка:
# https://github.com/Mrfyri111/cyberai-lab/releases/download/windows-latest/CyberAI_Lab.exe

name: Сборка CyberAI Lab для Windows

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview

      - name: Сборка .exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name CyberAI_Lab `
            --icon assets/cyberai.ico `
            --uac-admin `
            --add-data "app.py;." `
            --add-data "cyberai_engine.py;." `
            --add-data "database.py;." `
            --add-data "mailer.py;." `
            --add-data "pcap_reader.py;." `
            --add-data "demo_traffic.py;." `
            --add-data "app_check.py;." `
            --collect-all streamlit `
            --copy-metadata streamlit `
            --collect-all reportlab `
            --collect-submodules sklearn `
            --collect-data sklearn `
            --collect-submodules openai `
            --copy-metadata openai `
            --hidden-import psutil `
            --hidden-import cryptography.fernet `
            --collect-all webview `
            run_app.py

      - name: Самопроверка (библиотеки и поиск атак в демо)
        shell: pwsh
        run: |
          # Программа оконная: PowerShell сам не ждёт её завершения.
          $p = Start-Process -FilePath .\dist\CyberAI_Lab.exe -ArgumentList "--check" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\CyberAI Lab\cyberai.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Самопроверка не прошла (код $($p.ExitCode))" }

      - name: Проверка запуска интерфейса
        shell: pwsh
        run: |
          $env:CYBERAI_HEADLESS = "1"
          $proc = Start-Process -FilePath .\dist\CyberAI_Lab.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8501/_stcore/health" -UseBasicParsing -TimeoutSec 5
              if ($r.Content -match "ok") { $ok = $true; break }
            } catch { }
          }
          Get-Process -Name CyberAI_Lab -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) {
            Get-Content "$env:LOCALAPPDATA\CyberAI Lab\cyberai.log" -ErrorAction SilentlyContinue
            throw "Интерфейс не запустился за 3 минуты"
          }
          Write-Host "Интерфейс запустился"

      - uses: actions/upload-artifact@v4
        with:
          name: CyberAI_Lab
          path: dist/CyberAI_Lab.exe

      - name: Публикация в релиз windows-latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest `
              --title "CyberAI Lab для Windows" `
              --notes "Скачай CyberAI_Lab.exe и запусти. Нужна Windows 10 (2004+) или 11. Программа попросит права администратора — они нужны для записи трафика встроенной утилитой Windows pktmon. Wireshark не нужен."
          }
          gh release upload windows-latest dist/CyberAI_Lab.exe --clobber
